name: tarokza2
services:
  tarokza2:
    image: tarokza2:phone-width-20260924
    container_name: tarokza2
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      ROOM_CREATE_LIMIT: "60"
      ROOM_CREATE_WINDOW_MS: "3600000"
      TRUSTED_PROXIES: "172.20.0.1"
    volumes:
      - tarok-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  tarok-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
