services:
  tarokza2:
    build: .
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      ROOM_CREATE_LIMIT: "${ROOM_CREATE_LIMIT:-60}"
      ROOM_CREATE_WINDOW_MS: "${ROOM_CREATE_WINDOW_MS:-3600000}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - tarok-data:/app/data
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  tarok-data:
