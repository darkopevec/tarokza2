map $http_upgrade $tarok_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=tarok_http:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=tarok_connections:10m;
server {
    listen 80;
    listen [::]:80;
    server_name tarok.moonlitgarden.cc tarok.moonlitgarden.xyz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tarok.moonlitgarden.cc tarok.moonlitgarden.xyz;
    ssl_certificate /etc/letsencrypt/live/tarok/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarok/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/tarok.access.log;
    error_log /var/log/nginx/tarok.error.log;
    limit_req zone=tarok_http burst=100 nodelay;
    limit_req_status 429;
    limit_conn tarok_connections 30;
    limit_conn_status 429;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://tarok.moonlitgarden.cc wss://tarok.moonlitgarden.xyz; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tarok_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
